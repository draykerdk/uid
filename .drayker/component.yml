schema_version: 1
component:
  id: uid
  name: UID
  layer: PLATFORM
  artifact_type: architecture
  problem: Define identity, agentic delegation, and reputation architecture that separates biometric personhood, bounded autonomous proxies, and contextual reputation, with the member owning their data and without financialization.
  scope:
    - Public specification for 3-layer identity (biometric personhood, bounded proxy agents, and contextual reputation).
    - Multi-factor biometric personhood, certified by people at enrolment and verified continuously; once the network is running, only UID holders access the system.
    - Zero-knowledge proofs of credentials and pairwise non-correlation, including proof of a credential to services outside Drayker without access to personal data.
    - Collective identities of projects, organizations and clinics, formed by the UIDs of the members who compose them; a UID always corresponds to one living person.
    - Bounded agentic delegation rules, the absolute veto over one's own life and one's own personal Dk, and the justified contextual veto over decisions that directly affect the member's life and context.
    - "Non-transferable contextual reputation, evaluated by domain, and the reward: the only transferable reputation, earned by contributing capacity or by financing the network, which gives faster or priority access to resources."
    - The veto chain, a signed, hash-linked, append-only record of vetoes with their grounds, mandate revocations, ratification signatures, triage outcomes and council conclusions, replicated over Dk Network.
  non_scope:
    - A centralized identity provider or a central biometric database.
    - A monolithic social credit score or financialized reputation markets.
    - An operational application platform today.
  dependencies:
    - dk
    - dk-network
    - living-cryptography
    - pap
  implementation:
    level: none
    scope: UID specifies the 3-layer architectural model and safeguards; cryptographic execution tooling remains in research and development.
    evidence:
      - type: document
        ref: README.md
  risks:
    - Misinterpreting representative proxy agents as legal or constitutional personhood.
    - Premature correlation of pairwise identities across distinct domains.
    - Anonymous vetoes being re-identified through the grounds they carry.
    - Fabricated or coordinated grounds passing triage and changing a decision.
    - Biometric data used beyond what the member can see and has agreed to.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/uid/issues
  source_of_truth:
    repository: https://github.com/draykerdk/uid
    path: README.md
  last_reviewed: "2026-10-21"

# The Drayker documentation theme — one layout shared by every *.drayker.org site.
# Source: https://github.com/draykerdk/drayker-theme
remote_theme: draykerdk/drayker-theme

plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter

title: UID
description: Universal Identity Drayker — the identity layer and primary interface proposed for the platform's applications.

dk_kicker: Identity layer
dk_subdomain: uid.drayker.org
dk_repo: https://github.com/draykerdk/uid

defaults:
  - scope:
      path: ""
    values:
      layout: default
